    <!-- Theme Initialization: Default to Dark Mode -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('life_theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
